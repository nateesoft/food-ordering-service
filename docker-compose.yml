version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: food-ordering-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: food_ordering
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
